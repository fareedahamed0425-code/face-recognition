<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#021f12" />
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <rect x="6" y="6" width="128" height="128" rx="28" fill="#0d5c36" stroke="#021f12" stroke-width="4" />
  
  <!-- Sunshine Rays -->
  <path d="M 70 30 L 70 14" stroke="#ffd000" stroke-width="4" stroke-linecap="round" />
  <path d="M 46 36 L 34 24" stroke="#ffd000" stroke-width="4" stroke-linecap="round" />
  <path d="M 94 36 L 106 24" stroke="#ffd000" stroke-width="4" stroke-linecap="round" />
  <path d="M 30 54 L 14 50" stroke="#ffd000" stroke-width="4" stroke-linecap="round" />
  <path d="M 110 54 L 126 50" stroke="#ffd000" stroke-width="4" stroke-linecap="round" />

  <!-- Rising Sun -->
  <circle cx="70" cy="68" r="32" fill="url(#sunGrad)" stroke="#021f12" stroke-width="3" />

  <!-- Palm Fronds Silhouette (Left) -->
  <path d="M 24 100 Q 40 76 56 74 Q 46 88 44 102" fill="#094528" stroke="#021f12" stroke-width="2.5" />
  <path d="M 22 84 Q 38 68 54 72 Q 40 78 30 92" fill="#107545" stroke="#021f12" stroke-width="2" />
  
  <!-- Palm Fronds Silhouette (Right) -->
  <path d="M 116 100 Q 100 76 84 74 Q 94 88 96 102" fill="#094528" stroke="#021f12" stroke-width="2.5" />
  <path d="M 118 84 Q 102 68 86 72 Q 100 78 110 92" fill="#107545" stroke="#021f12" stroke-width="2" />

  <!-- Hot Pink MINDBRIDGE Banner -->
  <g filter="url(#popShadow)">
    <rect x="18" y="96" width="104" height="26" rx="6" fill="#ff007f" stroke="#021f12" stroke-width="3" transform="rotate(-3 70 109)" />
    <text x="70" y="114" font-family="'Plus Jakarta Sans', Impact, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1" transform="rotate(-3 70 109)">MINDBRIDGE</text>
  </g>

  <!-- Biometric Mesh Node in Sun -->
  <circle cx="60" cy="62" r="3.5" fill="#ff007f" stroke="#021f12" stroke-width="1.5" />
  <circle cx="80" cy="62" r="3.5" fill="#ff007f" stroke="#021f12" stroke-width="1.5" />
  <path d="M 64 74 Q 70 78 76 74" stroke="#021f12" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <line x1="60" y1="62" x2="80" y2="62" stroke="#021f12" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>
